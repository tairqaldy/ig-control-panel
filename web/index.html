<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Resurfly — turn your Instagram Saves graveyard into structured, searchable inspiration." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Resurfly</title>
    <script>
      // Apply saved theme before paint to avoid a flash
      try {
        var t = localStorage.getItem('rs-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
