<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Resurfly turns the posts you saved on Instagram into notes you can search: transcripts, summaries, key points and tags for every save, and answers with citations across all of them." />
    <link rel="canonical" href="https://resurfly.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Resurfly" />
    <meta property="og:title" content="Resurfly — every reel you saved, turned into notes you can search" />
    <meta property="og:description" content="Import your Instagram saves in a minute. Each one gets a transcript, a summary, key points and tags. Then ask questions across all of them." />
    <meta property="og:url" content="https://resurfly.com/" />
    <meta property="og:image" content="https://resurfly.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Resurfly — every reel you saved, turned into notes you can search" />
    <meta name="twitter:description" content="Import your Instagram saves in a minute. Each one gets a transcript, a summary, key points and tags. Then ask questions across all of them." />
    <meta name="twitter:image" content="https://resurfly.com/og.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Resurfly — every reel you saved, turned into notes you can search</title>
    <script>
      // Apply saved theme before paint to avoid a flash
      try {
        var t = localStorage.getItem('rs-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
